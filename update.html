<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update Vehicle</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body><header><a class="brand" href="/">🚘 Vehicle Rental</a><nav><a href="/">Home</a><a href="/list.html">Vehicle List</a><a href="/insert.html">Add</a><a class="active" href="/update.html">Update</a><a href="/delete.html">Delete</a></nav></header><main class="page narrow"><small>FLEET MANAGEMENT</small><h1>Update <em>vehicle</em></h1><p>Select a vehicle, then edit its details.</p><section class="panel"><label>Select vehicle<select id="updateSelect" data-select><option value="">Loading…</option></select></label><form id="updateForm" class="hidden"><div class="fields"><label>Vehicle Number<input name="vehicle_number" required></label><label>Model<input name="model" required></label><label>Rental Time<input type="time" name="rental_time" required></label><label>Rent Per Day (₹)<input type="number" name="rent_per_day" min="0" step=".01" required></label><label class="wide">Status<select name="status"><option>Available</option><option>Not Available</option></select></label></div><button class="btn">Save Changes</button></form><p id="message"></p></section></main><footer>© 2026 Vehicle Rental Management System</footer></body></html>
